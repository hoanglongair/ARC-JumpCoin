name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env file
        shell: bash
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/arc_jumpcoin"
            echo "ARC_RPC_URL=http://127.0.0.1:8545"
            echo "NEXT_PUBLIC_ARC_RPC_URL=http://127.0.0.1:8545"
            echo "NEXT_PUBLIC_CHAIN_ID=31337"
          } >> .env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Compile contracts
        run: pnpm contracts:compile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
